[project]
name = "verify-ping"
version = "0.4.0"
description = "ICMP, UDP, raw TCP, and TCP stream echo tester with payload verification"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Andrey Safonov", email = "asafonov@tunatech.io" }
]

[project.scripts]
verify-ping = "verify_ping:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["verify_ping"]
